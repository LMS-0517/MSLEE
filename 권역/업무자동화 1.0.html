const ub=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
/* 자동 업데이트: 열 때마다 저장소(GitHub Pages)의 최신본을 받아서 엶. 인터넷이 안 되면 이 파일에 들어 있는 버전으로 엶 */
const SRC='https://lms-0517.github.io/MSLEE/%EA%B6%8C%EC%97%AD/%EC%97%85%EB%AC%B4%EC%9E%90%EB%8F%99%ED%99%94%201.0.html';
async function latest(){try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),6000);
  const r=await fetch(SRC+'?t='+Date.now(),{cache:'no-store',signal:ctl.signal});clearTimeout(t);if(!r.ok)return null;
  const m=(await r.text()).match(/const APP=(\{.*?\});/);return m?JSON.parse(m[1].replace(/([a-z]+):/g,'"$1":')):null}catch(e){return null}}
async function unlock(pw,A){const te=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(A.salt),iterations:A.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(A.iv)},key,ub(A.d));
  return await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
async function openApp(pw,keep){const msg=document.getElementById('msg');if(msg)msg.textContent='최신 버전 확인 중…';const R=await latest();let html=null,src='이 파일';
  if(R&&R.d!==APP.d){try{html=await unlock(pw,R);src='최신'}catch(e){html=null}}
  if(html===null)html=await unlock(pw,APP);
  try{sessionStorage.setItem('app_src',src+(R?'':' (인터넷 확인 실패)'))}catch(e){}
  try{sessionStorage.setItem('app_pw_s',pw);if(keep)localStorage.setItem('app_pw',pw)}catch(e){}
  document.open();document.write(html);document.close()}
const $=id=>document.getElementById(id);
$('f').onsubmit=async e=>{e.preventDefault();const pw=$('pw').value.trim();if(!pw)return;$('go').disabled=true;$('msg').textContent='여는 중…';
  try{await openApp(pw,$('keep').checked)}catch(err){$('msg').textContent=/DecompressionStream/.test(String(err))?'이 브라우저는 지원하지 않습니다. 최신 크롬·엣지로 열어 주세요.':'암호가 맞지 않습니다';$('go').disabled=false;$('pw').select()}};
(async()=>{let s='';try{s=localStorage.getItem('app_pw')||sessionStorage.getItem('app_pw_s')||''}catch(e){}
  if(s){$('msg').textContent='여는 중…';try{await openApp(s,!!localStorage.getItem('app_pw'))}catch(e){try{localStorage.removeItem('app_pw');sessionStorage.removeItem('app_pw_s')}catch(_){}$('msg').textContent=''}}})();
})();
