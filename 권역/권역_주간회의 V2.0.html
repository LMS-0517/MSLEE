const ub=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function unlock(pw){const te=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(APP.salt),iterations:APP.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(APP.iv)},key,ub(APP.d));
  return await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
async function openApp(pw,keep){const html=await unlock(pw);
  try{sessionStorage.setItem('app_pw_s',pw);if(keep)localStorage.setItem('app_pw',pw)}catch(e){}
  document.open();document.write(html);document.close()}
const $=id=>document.getElementById(id);
$('f').onsubmit=async e=>{e.preventDefault();const pw=$('pw').value.trim();if(!pw)return;$('go').disabled=true;$('msg').textContent='여는 중…';
  try{await openApp(pw,$('keep').checked)}catch(err){$('msg').textContent=/DecompressionStream/.test(String(err))?'이 브라우저는 지원하지 않습니다. 최신 크롬·엣지로 열어 주세요.':'암호가 맞지 않습니다';$('go').disabled=false;$('pw').select()}};
(async()=>{let s='';try{s=localStorage.getItem('app_pw')||sessionStorage.getItem('app_pw_s')||''}catch(e){}
  if(s){$('msg').textContent='여는 중…';try{await openApp(s,!!localStorage.getItem('app_pw'))}catch(e){try{localStorage.removeItem('app_pw');sessionStorage.removeItem('app_pw_s')}catch(_){}$('msg').textContent=''}}})();
})();
</script>
