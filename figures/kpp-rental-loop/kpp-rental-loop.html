<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPP 파렛트 렌탈 회수 흐름</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --paper: #f8f8f8; --ink: #192e63; --muted: #555555; --soft: #666666;
  --accent: #b05800; --accent-tint: rgba(239,128,15,0.10); --rule: rgba(25,46,99,0.12);
  --sans: 'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
  --mono: 'Geist Mono', ui-monospace, monospace;
}
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
.frame { width: 100%; max-width: 860px; }
.eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
.diagram-container { width: 100%; overflow-x: auto; }
svg { display: block; width: 100%; min-width: 800px; }
@media print { svg { min-width: 0; } .diagram-container { overflow: visible; } }
.ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.ring.accent { stroke: var(--accent); }
.spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
.station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
.station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
.hub { fill: var(--ink); }
.node-name { fill: var(--ink); font: 600 13px var(--sans); text-anchor: middle; }
.focal-name { fill: var(--accent); }
.sub-ko { fill: var(--soft); font: 400 12px var(--sans); text-anchor: middle; }
.hub-name { fill: var(--paper); font: 600 16px var(--sans); text-anchor: middle; }
.hub-sub { fill: var(--paper); opacity: 0.8; font: 400 12px var(--sans); text-anchor: middle; }
.arrow-label-ko { fill: var(--soft); font: 500 12px var(--sans); text-anchor: middle; }
.legend-eyebrow { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; }
.legend-ko { fill: var(--muted); font: 400 12px var(--sans); }
.cards { display: grid; grid-template-columns: 1fr 1.15fr 1.25fr; gap: 12px; margin-top: 1.5rem; }
.card { background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; }
.card .k { font: 500 0.62rem var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.card .f { font: 600 0.95rem var(--sans); color: var(--ink); }
.card .f b { color: var(--accent); font-weight: 600; }
.card p { margin-top: 6px; font: 400 0.8rem/1.5 var(--sans); color: var(--muted); }
@media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main class="frame">
<p class="eyebrow">KPP · PPS 파렛트 풀</p>
<h1>파렛트 렌탈 회수 흐름</h1>
<div class="diagram-container">
<svg viewBox="0 0 800 736" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kpp-rental-loop-title kpp-rental-loop-desc">
<title id="kpp-rental-loop-title">KPP 파렛트 렌탈 회수 흐름</title>
<desc id="kpp-rental-loop-desc">KPP 데포에서 공급된 파렛트가 고객사 입고, 적재·사용, 출고를 거쳐 실물회수와 전산회수로 데포에 돌아오는 순환이며, 입고·출고·회수는 WPPS 수불 기록에 쌓여 회수율(회수 ÷ 순입고)을 만든다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#555555"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b05800"/></marker><marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker></defs>
<rect width="800" height="736" fill="#f8f8f8"/>
<path class="ring" d="M488.000 111.345 A260 260 0 0 1 634.121 242.918" marker-end="url(#arrow)"/>
<path class="ring" d="M655.531 308.000 A260 260 0 0 1 588.445 535.132" marker-end="url(#arrow)"/>
<path class="ring" d="M489.800 600.000 A260 260 0 0 1 311.327 600.412" marker-end="url(#arrow)"/>
<path class="ring" d="M212.383 536.000 A260 260 0 0 1 144.250 309.180" marker-end="url(#arrow)"/>
<path class="ring accent" d="M165.360 244.000 A260 260 0 0 1 310.872 111.754" marker-end="url(#arrow-accent)"/>
<path class="spoke" d="M560.0 304.4 L505.7 321.9" marker-end="url(#arrow-soft)"/>
<path class="spoke" d="M270.9 536.0 L359.2 412.9" marker-end="url(#arrow-soft)"/>
<path class="spoke" d="M240.0 304.4 L294.3 321.9" marker-end="url(#arrow-soft)"/>
<rect class="station" x="312" y="64" width="176" height="64" rx="6"/>
<text x="400" y="91" class="node-name">KPP 데포</text>
<text x="400" y="111" class="sub-ko">파렛트 공급</text>
<rect class="station" x="560" y="244" width="176" height="64" rx="6"/>
<text x="648" y="271" class="node-name">고객사 입고</text>
<text x="648" y="291" class="sub-ko">렌탈 시작</text>
<rect class="station" x="464" y="536" width="176" height="64" rx="6"/>
<text x="552" y="563" class="node-name">적재·사용</text>
<text x="552" y="583" class="sub-ko">구내용 · 수송용</text>
<rect class="station" x="160" y="536" width="176" height="64" rx="6"/>
<text x="248" y="563" class="node-name">출고</text>
<text x="248" y="583" class="sub-ko">출고통보로 이관</text>
<rect class="station focal" x="64" y="244" width="176" height="64" rx="6"/>
<text x="152" y="271" class="node-name focal-name">회수</text>
<text x="152" y="291" class="sub-ko">실물회수 + 전산회수</text>
<rect class="hub" x="300" y="304" width="200" height="104" rx="8"/>
<text x="400" y="342" class="hub-name">WPPS 수불</text>
<text x="400" y="366" class="hub-sub">입고 · 출고 · 회수 기록</text>
<text x="400" y="386" class="hub-sub">회수율 = 회수 ÷ 순입고</text>
<line x1="32" y1="672" x2="768" y2="672" stroke="rgba(25,46,99,0.10)" stroke-width="0.8"/>
<text x="32" y="700" class="legend-eyebrow">LEGEND</text>
<line x1="108" y1="696" x2="140" y2="696" class="ring" marker-end="url(#arrow)"/>
<text x="152" y="700" class="legend-ko">파렛트 이동</text>
<line x1="260" y1="696" x2="292" y2="696" class="spoke" marker-end="url(#arrow-soft)"/>
<text x="304" y="700" class="legend-ko">WPPS 전산 기록</text>
<line x1="432" y1="696" x2="464" y2="696" class="ring accent" marker-end="url(#arrow-accent)"/>
<rect x="476" y="688" width="16" height="12" rx="2" fill="rgba(239,128,15,0.10)" stroke="#b05800" stroke-width="1"/>
<text x="500" y="700" class="legend-ko">회수: 집중 관리 단계</text>
</svg>
</div>
<section class="cards" aria-label="회수 지표 정의">
  <div class="card"><div class="k">Net in</div><div class="f">순입고 = 입고 − 출고</div><p>고객사가 실제로 들고 있는 렌탈 수량.</p></div>
  <div class="card"><div class="k">Return</div><div class="f">회수 = 실물회수 + 전산회수</div><p>실물회수는 차량이 현장에서 수거한 수량, 전산회수는 전산으로만 처리돼 실물이 남아 있는 수량.</p></div>
  <div class="card"><div class="k">Rate</div><div class="f"><b>회수율</b> = 회수 ÷ 순입고 × 100</div><p>일반과 건자재는 목표가 달라(일반 99%대, 건자재 76.5%) 섞지 않고 함께 표기. 재고증감 (+)는 회수 부족.</p></div>
</section>
</main>
</body>
</html>
